<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>到校路线</title>
    <style>
        body{background-color:#f5f5f5;
            font-family: sans-serif;
            padding: 15px;
        }
        .list-title{
            font-size: 13px;
            color: #888;
            margin: 20px 0 8px 10px;
        }
        .list-group{
            background-color:#ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .list-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 15px;
            text-decoration: none;
            color:#333;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0f0;
        }
        .list-item:last-child{
            border-bottom: none;
        }
        .list-left{
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }
        .item-icon{
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .item-arrow{
            color: #ccc;
            font-size: 16px;
            font-family: monospace;
        }
        .list-item:hover{
            background-color: #f9f9f9;
        }
        .ps-card{
            display: block;
            background-color:#eff8ed;
            border-radius: 16px;
            padding:16px;
            text-decoration: none;
            color:#333;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card-header{
            display: flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom: 12px;
        }
        .header-left{
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-icon{
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .card-title{
            font-size: 16px;
            font-weight: 20px;
            color: #000;
        }
        .card-desc{
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>到校路线</h1>
    <div class="list-title">
        <h2>高铁站</h2>
    </div>
    <div class="ps-card">
        <div class="card-header">
            <div class="header-left">
                <img src="images/ps.svg"style="width: 20px; height:20px;">Ps:如果您要乘坐高铁抵达济南，那么Mr.Jh推荐您的高铁终点站设置为济南东站，因为济南东站距离山建仅有8km，而济南站距山建18km，济南西站据山建27km
            </div>
        </div>
    </div>
    <div class="list-group">  
        <a href="" class="list-item">
            <div class="item-left">
                <img src="images/railway-station.svg" class="item-icon" alt="高铁">
                <span>济南东站</span>
            </div> 
            <div class="item-arrow"><img src="images/right-arrow.svg" style="width:40px; height:40px">
            </div>
        </a>
    </div>        
        <div class="list-group">  
        <a href="" class="list-item">
            <div class="item-left">
                <img src="images/railway-station.svg" class="item-icon" alt="高铁">
                <span>济南西站</span>
            </div> 
            <div class="item-arrow"><img src="images/right-arrow.svg" style="width:40px; height:40px">
            </div>
        </a>
    </div>
        <div class="list-group">  
        <a href="" class="list-item">
            <div class="item-left">
                <img src="images/railway-station.svg" class="item-icon" alt="高铁">
                <span>济南站</span>
            </div> 
            <div class="item-arrow"><img src="images/right-arrow.svg" style="width:40px; height:40px">
            </div>
        </a>
        </div>              
    </div>
    
    
    <div class="list-title">
        <h3>机场</h3>
    </div>
   
    <div class="list-group">  
        <a href="" class="list-item">
            <div class="item-left">
                <img src="images/airport.svg" class="item-icon" alt="机场">
                <span>济南遥墙国际机场</span>
            </div> 
            <div class="item-arrow"><img src="images/right-arrow.svg" style="width:40px; height:40px"></div>
        </a>
    </div>    
</body>
</html>
