<!DOCTYPE html>
<html lang="zh-CN">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>济南东站</title>
    <style>
         body{background-color:#f5f5f5;
            font-family: sans-serif;
            padding: 15px;
        }
        .item-arrow{
            color: #ccc;
            font-size: 16px;
            font-family: monospace;
        }
        .ps-card{
            display: block;
            background-color:#eff8ed;
            border-radius: 16px;
            padding:16px;
            text-decoration: none;
            color:#333;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card-header{
            display: flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom: 12px;
        }
        .header-left{
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-icon{
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .card-desc{
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
    </style>
    </head>
    <body>
        <h1>济南东站</h1>
        <h2>到校方式</h2>
        <p>因为济南交通的关系，同学们只有两种交通方式到达山建</p>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="images/hint.svg" style="width: 20px; height:20px;">地铁转公交
                </div>
                <div class="item-arrow"><img src="images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">只能通过地铁转公交车的方式到达，并无直达车，当然您也可以选择公交转公交   
            </div> 
        </a>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="images/hint.svg" style="width: 20px; height:20px;">网约车/出租车
                </div>
                <div class="item-arrow"><img src="images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">如果您有太多的行李很难自行搬运，或您出站时轨道交通已不在运行时间，那么您应该需要打车或呼叫网约车。   
            </div> 
        </a>
       


   
    </body>
</html>
