<!DOCTYPE html>
<html lang="zh-CN">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>济南西站</title>
    <style>
         body{background-color:#f5f5f5;
            font-family: sans-serif;
            padding: 15px;
        }
        .item-arrow{
            color: #ccc;
            font-size: 16px;
            font-family: monospace;
        }
        .ps-card{
            display: block;
            background-color:#eff8ed;
            border-radius: 16px;
            padding:16px;
            text-decoration: none;
            color:#333;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card-header{
            display: flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom: 12px;
        }
        .header-left{
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-icon{
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .card-desc{
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
    </style>
    </head>
    <body>
        <h1>济南西站</h1>
        <h2>到校方式</h2>
        <a href="Wast Subway.html" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="images/hint.svg" style="width: 20px; height:20px;">公交转公交
                </div>
                <div class="item-arrow"><img src="images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">需要转公交可能有点麻烦，但这是步行最少的路线  
            </div> 
        </a>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="images/hint.svg" style="width: 20px; height:20px;">地铁转步行
                </div>
                <div class="item-arrow"><img src="images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">只能通过地铁到达山建的偏远校门，如若带着很多行李，颇为不便  
            </div> 
        </a>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="images/hint.svg" style="width: 20px; height:20px;">网约车/出租车
                </div>
                <div class="item-arrow"><img src="images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">因为距离遥远，打车费用颇为昂贵，本人并不推荐   
            </div> 
        </a>
       


   
    </body>
</html>
