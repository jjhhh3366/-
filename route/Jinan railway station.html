<!DOCTYPE html>
<html lang="zh-CN">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>济南站</title>
    <style>
         body{background-color:#f5f5f5;
            font-family: sans-serif;
            padding: 15px;
        }
        .item-arrow{
            color: #ccc;
            font-size: 16px;
            font-family: monospace;
        }
        .ps-card{
            display: block;
            background-color:#eff8ed;
            border-radius: 16px;
            padding:16px;
            text-decoration: none;
            color:#333;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .card-header{
            display: flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom: 12px;
        }
        .header-left{
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-icon{
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .card-desc{
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
    </style>
    </head>
    <body>
        <h1>济南站</h1>
        <h2>到校方式</h2>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="../images/hint.svg" style="width: 20px; height:20px;">公交转公交
                </div>
                <div class="item-arrow"><img src="../images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">公交导车的话，不怎么需要走，但是时间会略长一点   
            </div> 
        </a>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="../images/hint.svg" style="width: 20px; height:20px;">地铁转公交
                </div>
                <div class="item-arrow"><img src="../images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">地铁导车的话，时间能快一点，但是路比较糟心 
            </div> 
        </a>
        <a href="" class="ps-card">
            <div class="card-header">
                <div class="header-left">
                    <img src="../images/hint.svg" style="width: 20px; height:20px;">网约车/出租车
                </div>
                <div class="item-arrow"><img src="../images/right.svg"style="width: 20px;height:20px;"></div>
                
            </div>
            <div class="card-desc">和济南西站同样，因为距离问题，打车费用并不便宜，本人不推荐  
            </div> 
        </a>
       


   
    </body>
</html>
